<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ROSA Deal Modal</title>
    <style>
      [data-theme="light"] {
        --page: #e9edf4;
        --bg: #f4f6fa;
        --panel: #fff;
        --panel2: #eef2fa;
        --line: #d5dcea;
        --edge: #b3bfd6;
        --text: #1b2640;
        --muted: #5d6b85;
        --indigo: #4f46e5;
        --indigo2: #4f46e5;
        --pfield: #fff;
        --pline: #c9d2e3;
        --good: #1e9e57;
        --warn: #d97706;
        --bad: #dc2626;
        --shoulder: #7c3aed;
        --knee: #0d9488;
        --hip: #2563eb;
        --scrim: rgba(15, 23, 42, 0.45);
        --scheme: light;
      }
      [data-theme="dark"] {
        --page: #0e1623;
        --bg: #141e2e;
        --panel: #1a2740;
        --panel2: #20304f;
        --line: #2f4163;
        --edge: #5b6f93;
        --text: #e8edf5;
        --muted: #8b9bb0;
        --indigo: #6366f1;
        --indigo2: #a5b4fc;
        --pfield: #141e2e;
        --pline: #3a4e74;
        --good: #34d399;
        --warn: #fbbf24;
        --bad: #f87171;
        --shoulder: #a78bfa;
        --knee: #14b8a6;
        --hip: #2f80ed;
        --scrim: rgba(0, 0, 0, 0.6);
        --scheme: dark;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--page);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial,
          sans-serif;
        font-size: 15px;
      }
      button {
        font-family: inherit;
      }
      /* mockup controls (not part of the design) */
      .mock {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 50;
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        padding: 8px 16px;
        background: #111827;
        color: #e5e7eb;
        font-size: 13px;
      }
      .mock b {
        margin-right: 6px;
      }
      .mock button {
        background: #374151;
        color: #fff;
        border: 0;
        border-radius: 999px;
        padding: 5px 12px;
        cursor: pointer;
        font-size: 12px;
      }
      .mock button.on {
        background: #6366f1;
      }
      /* fake Salesforce page behind the modal */
      .sf {
        padding: 16px;
        filter: saturate(0.6);
      }
      .sf .bar {
        height: 44px;
        background: #fff;
        border-radius: 6px;
        margin-bottom: 12px;
        opacity: 0.8;
      }
      .sf .row {
        display: flex;
        gap: 12px;
      }
      .sf .blk {
        flex: 1;
        height: 520px;
        background: #fff;
        border-radius: 6px;
        opacity: 0.7;
      }
      [data-theme="dark"] .sf .bar,
      [data-theme="dark"] .sf .blk {
        background: #22304a;
      }
      .scrim {
        position: fixed;
        inset: 0;
        background: var(--scrim);
        backdrop-filter: blur(3px);
      }
      /* the modal */
      .modal {
        position: fixed;
        inset: 1.5vh 1.5vw;
        background: var(--bg);
        border-radius: 16px;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
        display: grid;
        grid-template-rows: auto 1fr;
        overflow: hidden;
      }
      .hdr {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px 24px;
        padding: 18px 24px 14px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
      }
      .title {
        display: flex;
        align-items: baseline;
        gap: 12px;
        flex-wrap: wrap;
      }
      .title h1 {
        margin: 0;
        font-size: 24px;
      }
      .sub {
        color: var(--muted);
        font-size: 14px;
      }
      .tag {
        display: inline-block;
        border-radius: 999px;
        padding: 3px 10px;
        font-size: 12px;
        font-weight: 700;
        background: var(--panel2);
        color: var(--muted);
      }
      .tag.sh {
        background: color-mix(in srgb, var(--shoulder) 15%, transparent);
        color: var(--shoulder);
      }
      .tag.ok {
        background: color-mix(in srgb, var(--good) 15%, transparent);
        color: var(--good);
      }
      .tag.wait {
        background: color-mix(in srgb, var(--warn) 15%, transparent);
        color: var(--warn);
      }
      .tools {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .rbtn {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 1.5px solid var(--edge);
        background: transparent;
        color: var(--text);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
      }
      .btn {
        border: 1px solid transparent;
        border-radius: 999px;
        background: var(--indigo);
        color: #fff;
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 9px 18px;
        cursor: pointer;
      }
      .btn.sec {
        background: transparent;
        border-color: var(--indigo2);
        color: var(--indigo2);
      }
      /* stage path: compact, fixed stages */
      .path {
        grid-column: 1/-1;
        display: flex;
        gap: 4px;
      }
      .path span {
        flex: 1;
        text-align: center;
        font-size: 12px;
        font-weight: 700;
        padding: 7px 4px;
        background: var(--panel2);
        color: var(--muted);
        border-radius: 6px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .path span.done {
        background: color-mix(in srgb, var(--indigo) 18%, transparent);
        color: var(--indigo2);
      }
      .path span.cur {
        background: var(--indigo);
        color: #fff;
      }
      .path span.lost {
        flex: 0.7;
      }
      .kpis {
        grid-column: 1/-1;
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 12px;
      }
      .kpi {
        background: var(--panel2);
        border-radius: 10px;
        padding: 10px 14px;
      }
      .kpi .v {
        font-size: 22px;
        font-weight: 800;
      }
      .kpi .l {
        font-size: 12px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      /* body: rail + main */
      .body {
        display: grid;
        grid-template-columns: 260px 1fr;
        min-height: 0;
      }
      .rail {
        border-right: 1px solid var(--line);
        background: var(--panel);
        overflow: auto;
        padding: 16px 12px;
      }
      .rail .grp {
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 16px 10px 6px;
      }
      .nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        width: 100%;
        text-align: left;
        border: 0;
        background: transparent;
        color: var(--text);
        padding: 9px 12px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 15px;
      }
      .nav:hover {
        background: var(--panel2);
      }
      .nav.on {
        background: var(--indigo);
        color: #fff;
      }
      .nav.sg {
        padding-left: 24px;
        font-size: 14px;
      }
      .nav .n {
        font-size: 12px;
        opacity: 0.8;
      }
      .nav.off {
        opacity: 0.45;
        cursor: default;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        flex: none;
        background: var(--edge);
      }
      .dot.ok {
        background: var(--good);
      }
      .dot.wait {
        background: var(--warn);
      }
      .main {
        overflow: auto;
        padding: 24px 28px 90px;
      }
      .crumb {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 14px;
        margin-bottom: 14px;
      }
      .crumb a {
        color: var(--indigo2);
        cursor: pointer;
        text-decoration: none;
        font-weight: 600;
      }
      h2 {
        margin: 0 0 4px;
        font-size: 22px;
      }
      .lead {
        color: var(--muted);
        margin: 0 0 18px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 18px 20px;
        margin-bottom: 20px;
      }
      .card h3 {
        margin: 0 0 12px;
        font-size: 17px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th {
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        text-align: left;
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
        font-weight: 700;
        white-space: nowrap;
      }
      td {
        padding: 11px 10px;
        border-bottom: 1px solid var(--line);
        vertical-align: middle;
      }
      td.num,
      th.num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      tr.click {
        cursor: pointer;
      }
      tr.click:hover td {
        background: var(--panel2);
      }
      .plus {
        color: var(--good);
        font-weight: 700;
      }
      .grid2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }
      .grid3 {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
      }
      .fields {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px 24px;
      }
      .f .l {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 3px;
      }
      .f .v {
        font-weight: 600;
      }
      select.in,
      input.in {
        height: 36px;
        background: var(--pfield);
        border: 1px solid var(--pline);
        border-radius: 8px;
        color: var(--text);
        font-size: 15px;
        padding: 0 10px;
        color-scheme: var(--scheme);
      }
      input.in.num {
        width: 90px;
        text-align: right;
      }
      /* surgeon detail */
      .shead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }
      .avatar {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: var(--panel2);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 18px;
        color: var(--indigo2);
      }
      .tabs {
        display: flex;
        gap: 6px;
        margin-bottom: 18px;
      }
      .pill {
        border: 1px solid var(--pline);
        background: var(--pfield);
        color: var(--text);
        border-radius: 999px;
        padding: 7px 15px;
        font-size: 14px;
        cursor: pointer;
      }
      .pill.on {
        background: var(--indigo);
        border-color: var(--indigo);
        color: #fff;
      }
      .q {
        display: grid;
        grid-template-columns: 28px 1fr 210px;
        gap: 14px;
        align-items: center;
        padding: 14px 0;
        border-bottom: 1px solid var(--line);
      }
      .q:last-child {
        border-bottom: 0;
      }
      .q .no {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: var(--panel2);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        font-weight: 700;
        color: var(--muted);
      }
      .q .by {
        font-size: 12px;
        color: var(--muted);
        text-align: right;
      }
      .tog {
        display: inline-flex;
        border: 1px solid var(--pline);
        border-radius: 999px;
        overflow: hidden;
      }
      .tog button {
        border: 0;
        background: transparent;
        color: var(--text);
        padding: 7px 14px;
        cursor: pointer;
        font-size: 13px;
      }
      .tog button.on {
        background: var(--good);
        color: #fff;
      }
      .bar {
        height: 10px;
        border-radius: 99px;
        background: var(--panel2);
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--good);
      }
      /* checklist */
      .phase h3 {
        display: flex;
        justify-content: space-between;
      }
      .step {
        display: grid;
        grid-template-columns: 26px 1fr;
        gap: 10px;
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
      }
      .step:last-child {
        border-bottom: 0;
      }
      .box {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        border: 2px solid var(--edge);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: #fff;
        font-size: 13px;
      }
      .box.on {
        background: var(--good);
        border-color: var(--good);
      }
      .step .meta {
        font-size: 12px;
        color: var(--muted);
        margin-top: 2px;
      }
      .note {
        font-size: 13px;
        color: var(--muted);
        border-left: 3px solid var(--indigo);
        padding: 6px 12px;
        margin: 0 0 18px;
        background: var(--panel);
      }
      .chat .m {
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
      }
      .chat .m b {
        font-size: 14px;
      }
      .chat .m .t {
        font-size: 12px;
        color: var(--muted);
      }
      /* marketing list */
      .list {
        position: fixed;
        inset: 0;
        overflow: auto;
        padding: 28px 32px 90px;
        background: var(--bg);
      }
      .filters {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin: 14px 0 18px;
      }

      /* v2 additions */
      .tag {
        white-space: nowrap;
      }
      .stbl td,
      .stbl th {
        padding: 10px 7px;
      }
      .stbl td:first-child b {
        white-space: nowrap;
      }
      .stbl td {
        white-space: nowrap;
      }
      .shead {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 24px;
        align-items: center;
        margin-bottom: 16px;
      }
      .shead h2 {
        margin: 0;
        display: flex;
        gap: 10px;
        align-items: center;
        white-space: nowrap;
      }
      .shead .tabs {
        margin: 0;
        justify-content: center;
      }
      .crumb {
        margin-bottom: 8px;
      }
      .card .ch {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        gap: 12px;
      }
      .card .ch h3 {
        margin: 0;
      }
      .ed {
        border: 0;
        background: transparent;
        color: var(--indigo2);
        font-weight: 700;
        font-size: 13px;
        cursor: pointer;
        padding: 6px 10px;
        border-radius: 999px;
      }
      .ed:hover {
        background: var(--panel2);
      }
      .card.editing {
        border-color: var(--indigo);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--indigo) 18%, transparent);
      }
      .acts {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        margin-top: 14px;
      }
      .fields.c4 {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
      .fields .in {
        width: 100%;
      }
      .chk {
        width: 20px;
        height: 20px;
        accent-color: var(--indigo);
      }
      /* compact Q&A */
      .qa {
        display: grid;
        grid-template-columns: 32px 1fr 128px 230px;
        gap: 14px;
        align-items: center;
        padding: 9px 0;
        border-bottom: 1px solid var(--line);
      }
      .qa:last-child {
        border-bottom: 0;
      }
      .qa .no {
        font-size: 13px;
        font-weight: 700;
        color: var(--muted);
      }
      .qa .by {
        font-size: 12px;
        color: var(--muted);
        text-align: right;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .yn {
        display: inline-flex;
        border: 1px solid var(--pline);
        border-radius: 999px;
        overflow: hidden;
      }
      .yn button {
        border: 0;
        background: transparent;
        color: var(--text);
        padding: 5px 16px;
        cursor: pointer;
        font-size: 13px;
      }
      .yn button.y {
        background: var(--good);
        color: #fff;
      }
      .yn button.n {
        background: var(--bad);
        color: #fff;
      }
      .sumrow {
        display: flex;
        gap: 18px;
        align-items: center;
        flex-wrap: wrap;
        font-size: 14px;
        color: var(--muted);
      }
      .sumrow b {
        color: var(--text);
      }
      /* credentialing status track */
      .track {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
        margin: 4px 0 18px;
      }
      .track span {
        text-align: center;
        padding: 8px 4px;
        border-radius: 8px;
        background: var(--panel2);
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }
      .track span.done {
        background: color-mix(in srgb, var(--good) 18%, transparent);
        color: var(--good);
      }
      .track span.cur {
        background: var(--good);
        color: #fff;
      }
      /* add surgeon drawer */
      .drawer {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(620px, 100%);
        background: var(--panel);
        border-left: 1px solid var(--line);
        box-shadow: -20px 0 50px rgba(0, 0, 0, 0.18);
        padding: 22px 24px;
        overflow: auto;
        z-index: 5;
      }
      .drawer h2 {
        margin-bottom: 2px;
      }
      .body {
        position: relative;
      }
      .search {
        position: relative;
      }
      .search .hit {
        border: 1px solid var(--line);
        border-radius: 10px;
        margin-top: 6px;
        background: var(--panel);
      }
      .search .hit div {
        padding: 9px 12px;
        border-bottom: 1px solid var(--line);
        font-size: 14px;
        cursor: pointer;
      }
      .search .hit div:last-child {
        border-bottom: 0;
      }
      .search .hit div:hover,
      .search .hit div.on {
        background: var(--panel2);
      }
      .vt td {
        padding: 6px 8px;
      }
      .vt th {
        padding: 6px 8px;
      }
      @media (max-width: 900px) {
        .modal {
          inset: 0;
          border-radius: 0;
        }
        .body {
          grid-template-columns: 1fr;
          grid-template-rows: auto 1fr;
        }
        .rail {
          display: flex;
          overflow-x: auto;
          gap: 6px;
          padding: 8px;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
        .rail .grp,
        .nav.sg {
          display: none;
        }
        .nav {
          white-space: nowrap;
          width: auto;
        }
        .hdr {
          padding: 12px 16px;
        }
        .title h1 {
          font-size: 19px;
        }
        .hdr .sub,
        .hdr .btn.sec,
        .title .tag {
          display: none;
        }
        .kpis {
          grid-template-columns: repeat(3, 1fr);
          gap: 6px;
        }
        .kpi {
          padding: 6px 8px;
        }
        .kpi .v {
          font-size: 16px;
        }
        .kpi .l {
          font-size: 9px;
        }
        .kpi:nth-child(2),
        .kpi:nth-child(3) {
          display: none;
        }
        .path span {
          display: none;
        }
        .path span.cur {
          display: block;
        }
        .card {
          overflow-x: auto;
        }
        .mock {
          font-size: 11px;
        }
        .fields,
        .fields.c4,
        .grid2,
        .grid3 {
          grid-template-columns: 1fr;
        }
        .main {
          padding: 16px 16px 90px;
        }
        .shead {
          grid-template-columns: 1fr auto;
        }
        .shead .tabs {
          grid-column: 1/-1;
          grid-row: 2;
          justify-content: flex-start;
          overflow-x: auto;
        }
        .qa {
          grid-template-columns: 24px 1fr;
          row-gap: 6px;
        }
        .qa .yn,
        .qa .by {
          grid-column: 2;
          text-align: left;
        }
        .track {
          grid-template-columns: repeat(2, 1fr);
        }
        .list {
          padding: 16px 16px 90px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="mock">
      <b>Mockup v2</b>
      <button data-screen="modal" class="on">Single deal (modal)</button>
      <button data-screen="list">Marketing: many deals</button>
      <span style="flex: 1"></span>
      <button data-theme-set="light" class="on">Light</button
      ><button data-theme-set="dark">Dark</button>
      <span style="opacity: 0.7">Sample data only</span>
    </div>
    <script>
      const STAGES = [
        "Sales Pipeline",
        "Surgeon Engagement",
        "Executive Presentation",
        "Negotiation",
        "Closed Won"
      ];
      const JOINTS = [
        ["TKA", "Knee (TKA)"],
        ["PKA", "Partial knee (PKA)"],
        ["THA", "Hip (THA)"],
        ["TSA_RSA", "Shoulder (TSA/RSA)"]

     const d = deal.steps[n];
     const lock = String(n).startsWith("7") && deal.stage < 4;
     return `<div class="step" style="${lock ? "opacity:.45" : ""}"><span class="box ${d ? "on" : ""}" data-step="${lock ? "" : n}">${d ? "✓" : ""}</span><div><b>${n}. ${l}</b><div class="meta">${d ? `${d[0]} · ${d[1]}` : lock ? "Opens at Closed Won" : "Not done"}</div></div></div>`;
   })
   .join("")}</div>`
 ).join("")}</div>`;
      }
      function secOverview() {
        const e = "ov";
        return `<h2>Overview</h2><p class="lead">The deal at a glance. Press Edit to change it here, no need to open Salesforce.</p>
 <div class="card ${isEd(e) ? "editing" : ""}"><div class="ch"><h3>Deal</h3>${edBtn(e)}</div><div class="fields c4">
 ${F("Hospital", deal.name)}${fld(e, "Primary HCP", "d.hcp", deal.hcp)}${fld(e, "ROSA deal lead", "d.lead", deal.lead)}${fld(e, "Deal type", "d.type", deal.type, "sel", ["Capital Sale", "Rental", "Placement", "ROSA-E", "ROSA-T"])}
 ${fld(e, "Sales type", "d.sales", deal.sales, "sel", ["Hip", "Knee", "Shoulder", "Brain"])}${F("Stage", STAGES[deal.stage] + ' <span class="sub">(moved by the checklist)</span>')}${fld(e, "Expected close", "d.close", deal.close, "date", null, fmtD(deal.close))}${fld(e, "Install date", "d.install", deal.install, "date", null, fmtD(deal.install))}
 ${fld(e, "ROSA growth $", "d.growth", deal.growth, "text", null, "$" + deal.growth)}${fld(e, "Priority", "d.priority", deal.priority, "sel", ["High", "Medium", "Low"])}${fld(e, "State priority", "d.spri", deal.spri)}${F("Currency", "AUD")}
 </div>${acts(e)}</div>
 <div class="grid2"><div class="card"><h3>Next step</h3><p style="margin:0">5. Proposal and negotiation</p><p class="sub">Owner: deal lead, Commercial, Legal</p></div><div class="card"><h3>Implant deals linked</h3><p style="margin:0">IMP-10482 Dr Emma Hart · IMP-10511 Dr Priya Nair</p></div></div>`;
      }
      function secSite() {
        const e = "site",
          x = deal.site;
        return `<h2>Site background</h2><p class="lead">Case support and training on site.</p><div class="card ${isEd(e) ? "editing" : ""}"><div class="ch"><h3>Case support</h3>${edBtn(e)}</div><div class="fields c4">
 ${fld(e, "Rep ROSA trained", "x.site.trained", x.trained, "sel", ["Yes", "No"])}${fld(e, "Rep suitable for case cover", "x.site.suit", x.suit, "sel", ["Yes", "No", "Unsure"])}${fld(e, "Primary case cover", "x.site.p1", x.p1)}${fld(e, "Secondary case cover", "x.site.p2", x.p2)}
 ${fld(e, "Additional case support", "x.site.extra", x.extra, "sel", ["Yes", "No"])}${fld(e, "Trainee surgeons", "x.site.trainees", x.trainees, "number")}${fld(e, "Fellows", "x.site.fellows", x.fellows, "number")}</div>
 <div class="grid2" style="margin-top:16px">${fld(e, "Exposure plan", "x.site.plan", x.plan)}${fld(e, "Critical to approval", "x.site.crit", x.crit)}</div>${acts(e)}</div>`;
      }
      function secApprop() {
        const e = "ap",
          x = deal.approp;
        return `<h2>Appropriateness</h2><p class="lead">From the product guide checklist.</p><div class="card ${isEd(e) ? "editing" : ""}"><div class="ch"><h3>Site fit</h3>${edBtn(e)}</div><div class="fields c4">
 ${fld(e, "Site already has ROSA", "x.approp.unit", x.unit, "sel", ["Yes", "No"])}${fld(e, "Current utilisation", "x.approp.util", x.util, "sel", ["Low", "Medium", "High", "N/A"])}${fld(e, "Additional unit required", "x.approp.addl", x.addl, "sel", ["Yes", "No", "N/A"])}${fld(e, "Competitor robotics on site", "x.approp.comp", x.comp)}</div>
 <div class="grid2" style="margin-top:16px">${fld(e, "Additional opportunities", "x.approp.opps", x.opps)}${fld(e, "Identified risks", "x.approp.risks", x.risks)}</div>${acts(e)}</div>`;
      }
      function secImplement() {
        const ph = STEPS[2];
        return `<h2>Implementation</h2><p class="lead">Install, instruments, credentialing and first cases. The stage stays Closed Won.</p>
 <div class="grid2"><div class="card phase"><h3>Steps 7a to 7d</h3>${ph[1]
   .map(([n, l]) => {
     const d = deal.steps[n];
     return `<div class="step"><span class="box ${d ? "on" : ""}" data-step="${n}">${d ? "✓" : ""}</span><div><b>${n}. ${l}</b><div class="meta">${d ? `${d[0]} · ${d[1]}` : "Not done"}</div></div></div>`;
   })
   .join("")}</div>
 <div class="card"><h3>Credentialing by surgeon</h3><table><tbody>${deal.surgeons.map((s) => `<tr class="click" data-sid="${s.id}" data-go="cred"><td><b>${s.name}</b></td><td>Wave ${s.cred.wave || "–"}</td><td>${credSum(s)}</td></tr>`).join("")}</tbody></table><p class="sub">7c ticks itself when every surgeon is credentialed.</p></div></div>`;
      }
      function secChatter() {
        return `<h2>Chatter</h2><p class="lead">The deal's feed, without leaving the deal.</p><div class="card chat"><input class="in" style="width:100%;margin-bottom:8px" placeholder="Share an update…">${deal.chat.map(([w, t, d]) => `<div class="m"><b>${w}</b> <span class="t">${d}</span><div>${t}</div></div>`).join("")}</div>`;
      }
      function modal() {
        let m = view.sid
          ? secSurgeon()
          : (
              {
                surgeons: secSurgeons,
                checklist: secChecklist,
                overview: secOverview,
                site: secSite,
                approp: secApprop,
                implement: secImplement,
                chatter: secChatter
              }[view.sec] || secSurgeons
            )();
        return `<div class="sf"><div class="bar"></div><div class="bar" style="height:70px"></div><div class="row"><div class="blk"></div><div class="blk" style="flex:.6"></div></div></div><div class="scrim"></div>
 <div class="modal" role="dialog" aria-label="ROSA deal">${header()}<div class="body">${rail()}<main class="main">${m}</main>${view.add ? drawer() : ""}</div></div>`;
      }
      function list() {
        const rows = [
          [
            "Sample Private Hospital",
            "Australia",
            "Shoulder",
            "Executive Presentation",
            4,
            "+425",
            "1/4"
          ],
          [
            "North Shore Sample",
            "Australia",
            "Knee",
            "Negotiation",
            6,
            "+240",
            "0/6"
          ],
          [
            "Harbour Sample Clinic",
            "New Zealand",
            "Shoulder",
            "Surgeon Engagement",
            2,
            "+40",
            "0/2"
          ],
          [
            "Central Sample Hospital",
            "India",
            "Knee, Hip",
            "Closed Won",
            5,
            "+310",
            "3/5"
          ],
          [
            "Bay Sample Medical",
            "Singapore",
            "Knee",
            "Sales Pipeline",
            1,
            "+25",
            "0/1"
          ]
        ];
        return `<div class="list"><h2>ROSA deals</h2><p class="lead">For marketing and the ROSA team: every ROSA deal in one list. Click a deal to open the same modal.</p>
 <div class="filters"><select class="in"><option>All countries</option></select><select class="in"><option>All stages</option></select><select class="in"><option>All platforms</option></select><button class="pill on">Open</button><button class="pill">Closed</button><span style="flex:1"></span><input class="in" placeholder="Search deals or surgeons"></div>
 <div class="card"><table><thead><tr><th>Hospital</th><th>Country</th><th>Platform</th><th>Stage</th><th class="num">Surgeons</th><th class="num">Growth cases</th><th class="num">Credentialed</th></tr></thead><tbody>
 ${rows.map((r) => `<tr class="click" data-open="1"><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td class="num">${r[4]}</td><td class="num plus">${r[5]}</td><td class="num">${r[6]}</td></tr>`).join("")}</tbody></table></div>
 <div class="grid3"><div class="card"><h3>Questions not answered</h3><p class="sub" style="margin:0">9 surgeons</p></div><div class="card"><h3>Booked for Med Ed lab</h3><p class="sub" style="margin:0">2 surgeons</p></div><div class="card"><h3>Installs next 90 days</h3><p class="sub" style="margin:0">1 deal</p></div></div></div>`;
      }
      const app = document.getElementById("app");
      function render() {
        app.innerHTML = view.screen === "list" ? list() : modal();
        document
          .querySelectorAll("[data-screen]")
          .forEach((b) =>
            b.classList.toggle("on", b.dataset.screen === view.screen)
          );
      }
      function target(path) {
        const p = path.split(".");
        let o =
          p[0] === "s"
            ? cur()
            : p[0] === "d"
              ? deal
              : p[0] === "x"
                ? deal
                : p[0] === "n"
                  ? window._new
                  : null;
        for (let i = 1; i < p.length - 1; i++) o = o[p[i]];
        return [o, p[p.length - 1]];
      }
      let draft = {};
      document.addEventListener("click", (e) => {
        const t = e.target.closest(
          "[data-sec],[data-sid],[data-stab],[data-ans],[data-step],[data-screen],[data-theme-set],[data-open],[data-edit],[data-cancel],[data-save],[data-add],[data-close-add],[data-pick]"
        );
        if (!t) return;
        const d = t.dataset;
        if (d.screen) {
          view.screen = d.screen;
        } else if (d.themeSet) {
          document.documentElement.dataset.theme = d.themeSet;
          document
            .querySelectorAll("[data-theme-set]")
            .forEach((b) => b.classList.toggle("on", b === t));
          return;
        } else if (d.open) {
          view = {
            screen: "modal",
            sec: "surgeons",
            sid: null,
            stab: "details",
            edit: null,
            add: false
          };
        } else if (d.edit) {
          view.edit = d.edit;
          draft = {};
        } else if (d.cancel !== undefined) {
          view.edit = null;
          draft = {};
        } else if (d.save) {
          Object.entries(draft).forEach(([k, v]) => {
            const [o, f] = target(k);
            if (o) o[f] = f.endsWith("c") && k.includes("vol") ? +v : v;
          });
          view.edit = null;
          draft = {};
        } else if (d.add !== undefined) {
          view.add = true;
          view.pick = null;
        } else if (d.closeAdd !== undefined) {
          view.add = false;
          window._new = null;
        } else if (d.pick !== undefined) {
          view.pick = +d.pick;
        } else if (d.sid) {
          view.sid = +d.sid;
          view.edit = null;
          if (d.go) view.stab = d.go;
        } else if (d.sec) {
          view.sec = d.sec;
          view.sid = null;
          view.edit = null;
        } else if (d.stab) {
          view.stab = d.stab;
          view.edit = null;
        } else if (d.ans !== undefined) {
          const a = cur().qa[+d.ans];
          if (a.v === d.v) {
            a.v = null;
          } else {
            a.v = d.v;
            a.by = "You";
            a.at = "just now";
          }
        } else if (d.step) {
          const n = d.step;
          if (deal.steps[n]) delete deal.steps[n];
          else deal.steps[n] = ["today", "you"];
          const hi = Math.max(
            0,
            ...Object.keys(deal.steps)
              .filter((k) => !k.startsWith("7"))
              .map(Number)
          );
          deal.stage =
            hi >= 6 ? 4 : hi === 5 ? 3 : hi === 4 ? 2 : hi >= 1 ? 1 : 0;
        } else return;
        render();
      });
      document.addEventListener("change", (e) => {
        const t = e.target;
        if (!t.dataset.f) return;
        const v = t.type === "checkbox" ? t.checked : t.value;
        if (t.dataset.f.startsWith("n.")) {
          const [o, f] = target(t.dataset.f);
          o[f] = f.endsWith("c") ? +v : v;
          render();
          return;
        }
        draft[t.dataset.f] = v;
      });
      render();
    </script>
  </body>
</html>
