<template>
  <div class={bandCls}>
    <div class="bandl"><slot name="heading"></slot></div>
    <div class="tiles" lwc:if={notValueRow}>
      <template for:each={tiles} for:item="t">
        <div key={t.key} class={t.cls}>
          <b class={t.valCls}>{t.value}</b><span>{t.label}</span>
        </div>
      </template>
    </div>
    <c-pipeline-segmented
      lwc:if={showValueRow}
      class="currencyseg"
      heading="Currency"
      label="Currency"
      options={currencyOptions}
      value={currencyValue}
      onchange={handleCurrency}
    ></c-pipeline-segmented>
  </div>

  <template lwc:if={showValueRow}>
    <div class="vrow">
      <template for:each={valueChips} for:item="c">
        <div key={c.key} class={c.cls}>
          <span class="vl"
            ><span lwc:if={c.plateCls} class={c.plateCls}>{c.label}</span
            ><template lwc:else>{c.label}</template></span
          >
          <b class="vv">{c.text}</b>
        </div>
      </template>
      <div class="tiles ctiles">
        <template for:each={tiles} for:item="t">
          <div key={t.key} class={t.cls}>
            <b class={t.valCls}>{t.value}</b><span>{t.label}</span>
          </div>
        </template>
      </div>
    </div>
    <p class="vnote bad" lwc:if={ratesError}>{ratesError}</p>
  </template>

  <div class="card full tablecard">
    <div class="cardhead">
      <h2>Members</h2>
      <c-pipeline-segmented
        lwc:if={maintainable}
        class="modeseg"
        heading="Mode"
        label="Mode"
        options={modeOptions}
        value={mode}
        onchange={handleMode}
      ></c-pipeline-segmented>
      <div
        class="tychips"
        lwc:if={isMaintain}
        role="group"
        aria-label="Which deals to list"
      >
        <button
          type="button"
          role="checkbox"
          aria-checked={oppOn}
          class={oppCls}
          data-kind="opp"
          onclick={handleKind}
        >
          Opportunities <span class={oppTickCls}></span>
        </button>
        <button
          type="button"
          role="checkbox"
          aria-checked={riskOn}
          class={riskCls}
          data-kind="risk"
          onclick={handleKind}
        >
          Risks <span class={riskTickCls}></span>
        </button>
        <button
          type="button"
          role="checkbox"
          aria-checked={closedOn}
          class={closedCls}
          onclick={handleClosed}
        >
          Include Closed <span class={closedTickCls}></span>
        </button>
      </div>
      <c-pipeline-segmented
        lwc:if={notMaintain}
        class="showseg"
        heading="Show"
        label="Show"
        options={showOptions}
        value={filter}
        onchange={handleFilter}
      ></c-pipeline-segmented>
      <div class="fwrap">
        <span class={fslblCls}>{searchLabel}</span>
        <span class="ffield">
          <input
            class="fin"
            type="text"
            placeholder="Surgeon"
            aria-label={searchAria}
            value={searchValue}
            oninput={handleQ}
          />
          <button
            type="button"
            class="xcirc fclear"
            lwc:if={hasQ}
            aria-label="Clear"
            onclick={handleQClear}
          ></button>
        </span>
        <div class="addpop" lwc:if={showAddPop}>
          <div class="addlist">
            <template for:each={addHits} for:item="h">
              <div class="hit" key={h.key}>
                <div class="hn">
                  <b>{h.nameText}</b>
                  <small>{h.sub}</small>
                </div>
                <span class="already" lwc:if={h.already}>
                  already in the campaign
                </span>
                <button
                  type="button"
                  class="rb add s30"
                  lwc:else
                  data-id={h.id}
                  disabled={addBusy}
                  title={h.title}
                  aria-label={h.title}
                  onclick={handleAddPress}
                >
                  <span class="mark"></span>
                </button>
              </div>
            </template>
            <div class="afoot" lwc:if={addNone}>No surgeon matches.</div>
          </div>
          <div class="afoot" lwc:if={addOutsideText}>{addOutsideText}</div>
          <div class="afoot bad" lwc:if={addError}>{addError}</div>
          <div class="afoot scope" lwc:if={addResult}>
            <span>{addScopeText}</span>
            <button type="button" class="btn small" onclick={handleWiden}>
              {addWidenText}
            </button>
          </div>
        </div>
      </div>
      <slot name="tools"></slot>
      <span class="sp"></span>
      <slot name="remove"></slot>
      <button
        type="button"
        class="cog"
        lwc:if={notMaintain}
        title="Choose the columns"
        aria-label="Choose the columns"
        onclick={handlePicker}
      >
        <svg
          viewBox="0 0 24 24"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="3.2"></circle>
          <path
            d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.56-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.01a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.01a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.56 1.03z"
          ></path>
        </svg>
      </button>
    </div>
    <slot name="ask"></slot>

    <div class="tscroll stick">
      <c-pipeline-campaign-maintain
        lwc:if={isMaintain}
        onmemberchange={handleMemberChange}
        campaign={campaign}
        members={maintainMembers}
        types={types}
        include-closed={includeClosed}
        usd={showUsd}
        rates={rates}
        ondealchange={handleDealChange}
      ></c-pipeline-campaign-maintain>
      <table class="tbl" style={tableStyle} lwc:else>
        <colgroup lwc:if={hasWidths}>
          <template for:each={colList} for:item="c">
            <col key={c.id} style={c.style} />
          </template>
        </colgroup>
        <thead>
          <tr>
            <th class="tick" lwc:if={manage}>
              <input
                type="checkbox"
                class="selall"
                checked={allTicked}
                aria-label="Select all members"
                title="Select all"
                onchange={handleTickAll}
              />
            </th>
            <template for:each={heads} for:item="h">
              <th key={h.id} class={h.cls} data-id={h.id}>
                <span
                  class="lab2"
                  data-id={h.id}
                  onclick={handleSort}
                  title="Click to sort"
                  >{h.label}<span class="arrow">{h.arrow}</span></span
                >
                <i
                  class="rz"
                  data-id={h.id}
                  title="Drag to resize. Double-click to reset the widths."
                  onmousedown={handleResizeStart}
                  ondblclick={handleWidthsReset}
                ></i>
              </th>
            </template>
          </tr>
        </thead>
        <tbody>
          <template for:each={rows} for:item="r">
            <tr
              key={r.key}
              class={r.cls}
              data-deal={r.dealId}
              onclick={handleRowClick}
            >
              <template for:each={r.cells} for:item="c">
                <td key={c.key} class={c.cls} colspan={c.colspan}>
                  <input
                    lwc:if={c.isTick}
                    type="checkbox"
                    data-id={c.id}
                    checked={c.checked}
                    onchange={handleTick}
                  />
                  <template lwc:if={c.isRate}>
                    <button
                      type="button"
                      lwc:if={c.rateOpen}
                      class={c.rateCls}
                      data-deal={c.dealId}
                      data-account={c.accountId}
                      data-who={c.who}
                      title="Open this surgeon's usages"
                      onclick={handlePlate}
                    >
                      {c.text}
                    </button>
                    <span lwc:else class={c.rateCls}>{c.text}</span>
                  </template>
                  <span lwc:if={c.isTag} class={c.tagCls}>{c.text}</span>
                  <template lwc:if={c.isNoDeal}>
                    <button
                      type="button"
                      lwc:if={c.noDealOpen}
                      class="nodeal nodealbtn"
                      data-account={c.accountId}
                      data-who={c.who}
                      title="Make this surgeon's first deal"
                      onclick={handleNoDeal}
                    >
                      No deal yet
                    </button>
                    <span lwc:else class="nodeal">No deal yet</span>
                  </template>
                  <a
                    lwc:if={c.isLink}
                    class="slink"
                    href={c.href}
                    target="_blank"
                    rel="noopener noreferrer"
                    title="Open this surgeon's record in a new tab"
                    >{c.text}</a
                  >
                  <template lwc:if={c.isText}>{c.text}</template>
                </td>
              </template>
            </tr>
          </template>
          <tr lwc:if={noRows}>
            <td class="empty" colspan={emptySpan}>{emptyText}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="backdrop" lwc:if={pickerOpen} onclick={handlePicker}></div>
  <div class="picker" lwc:if={pickerOpen} role="dialog" aria-label="Columns">
    <h3>Columns</h3>
    <template for:each={pickerItems} for:item="c">
      <label class="pk" key={c.id}>
        <input
          type="checkbox"
          checked={c.on}
          data-id={c.id}
          onchange={handleColumn}
        />
        <span>{c.label}</span>
      </label>
    </template>
    <div class="pkfoot">
      <button type="button" class="btn ghost" onclick={handleColumnsReset}>
        Reset columns
      </button>
      <button type="button" class="btn ghost" onclick={handlePickerWidthsReset}>
        Reset widths
      </button>
      <span class="sp"></span>
      <button type="button" class="btn small" onclick={handlePicker}>
        Done
      </button>
    </div>
  </div>
  <div class="atoast" lwc:if={addToast}>{addToast}</div>
  <div class="await" lwc:if={addBusy}>
    <div class="aspin"></div>
    <span>Please wait…</span>
  </div>
</template>
