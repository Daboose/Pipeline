<template>
  <div class="band">
    <div class="bandl"><slot name="heading"></slot></div>
    <div class="tiles">
      <template for:each={tiles} for:item="t">
        <div key={t.key} class={t.cls}>
          <b class={t.valCls}>{t.value}</b><span>{t.label}</span>
        </div>
      </template>
    </div>
  </div>

  <div class="card full tablecard">
    <div class="cardhead">
      <h2>Members</h2>
      <c-pipeline-segmented
        class="showseg"
        heading="Show"
        label="Show"
        options={showOptions}
        value={filter}
        onchange={handleFilter}
      ></c-pipeline-segmented>
      <div class="fwrap">
        <span class="fslbl">Search</span>
        <span class="ffield">
          <input
            class="fin"
            type="text"
            placeholder="Surgeon"
            aria-label="Search surgeons"
            value={q}
            oninput={handleQ}
          />
          <button
            type="button"
            class="xcirc fclear"
            lwc:if={hasQ}
            aria-label="Clear"
            onclick={handleQClear}
          ></button>
        </span>
      </div>
      <slot name="tools"></slot>
      <span class="sp"></span>
      <slot name="remove"></slot>
      <button
        type="button"
        class="cog"
        title="Choose the columns"
        aria-label="Choose the columns"
        onclick={handlePicker}
      >
        <svg
          viewBox="0 0 24 24"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="3.2"></circle>
          <path
            d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.56-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.01a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.01a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.56 1.03z"
          ></path>
        </svg>
      </button>
    </div>
    <slot name="ask"></slot>

    <div class="tscroll stick">
      <table class="tbl" style={tableStyle}>
        <colgroup lwc:if={hasWidths}>
          <template for:each={colList} for:item="c">
            <col key={c.id} style={c.style} />
          </template>
        </colgroup>
        <thead>
          <tr>
            <th class="tick" lwc:if={manage}>
              <input
                type="checkbox"
                class="selall"
                checked={allTicked}
                aria-label="Select all members"
                title="Select all"
                onchange={handleTickAll}
              />
            </th>
            <template for:each={heads} for:item="h">
              <th key={h.id} class={h.cls} data-id={h.id}>
                <span
                  class="lab2"
                  data-id={h.id}
                  onclick={handleSort}
                  title="Click to sort"
                  >{h.label}<span class="arrow">{h.arrow}</span></span
                >
                <i
                  class="rz"
                  data-id={h.id}
                  title="Drag to resize. Double-click to reset the widths."
                  onmousedown={handleResizeStart}
                  ondblclick={handleWidthsReset}
                ></i>
              </th>
            </template>
          </tr>
        </thead>
        <tbody>
          <template for:each={rows} for:item="r">
            <tr key={r.key} class={r.cls}>
              <template for:each={r.cells} for:item="c">
                <td key={c.key} class={c.cls} colspan={c.colspan}>
                  <input
                    lwc:if={c.isTick}
                    type="checkbox"
                    data-id={c.id}
                    checked={c.checked}
                    onchange={handleTick}
                  />
                  <span lwc:if={c.isRate} class={c.rateCls}>{c.text}</span>
                  <span lwc:if={c.isTag} class={c.tagCls}>{c.text}</span>
                  <template lwc:if={c.isNoDeal}>
                    <span class="nodeal">No deal yet</span>
                  </template>
                  <template lwc:if={c.isText}>{c.text}</template>
                </td>
              </template>
            </tr>
          </template>
          <tr lwc:if={noRows}>
            <td class="empty" colspan={emptySpan}>{emptyText}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="backdrop" lwc:if={pickerOpen} onclick={handlePicker}></div>
  <div class="picker" lwc:if={pickerOpen} role="dialog" aria-label="Columns">
    <h3>Columns</h3>
    <template for:each={pickerItems} for:item="c">
      <label class="pk" key={c.id}>
        <input
          type="checkbox"
          checked={c.on}
          data-id={c.id}
          onchange={handleColumn}
        />
        <span>{c.label}</span>
      </label>
    </template>
    <div class="pkfoot">
      <button type="button" class="btn ghost" onclick={handleColumnsReset}>
        Reset columns
      </button>
      <button type="button" class="btn ghost" onclick={handlePickerWidthsReset}>
        Reset widths
      </button>
      <span class="sp"></span>
      <button type="button" class="btn small" onclick={handlePicker}>
        Done
      </button>
    </div>
  </div>
</template>
