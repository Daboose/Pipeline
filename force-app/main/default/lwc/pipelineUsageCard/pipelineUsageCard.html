<template>
  <div class={busyCls}>
    <template for:each={neededRts} for:item="rt">
      <c-pipeline-usage-field-choices
        key={rt.id}
        record-type-id={rt.id}
        onfieldchoices={handleChoices}
      ></c-pipeline-usage-field-choices>
    </template>

    <div class="head" lwc:if={showHead}>
      <h2>{heading}</h2>
      <span class="sp"></span>
      <template lwc:if={isHospital}>
        <div class="modeswitch" lwc:if={showSwitch}>
          <c-pipeline-segmented
            label="Show MyCase bookings or usage records"
            options={modeOptions}
            value={hmode}
            onchange={handleMode}
          ></c-pipeline-segmented>
        </div>
      </template>
    </div>

    <template lwc:if={loading}>
      <div class="empty">Loading…</div>
    </template>
    <template lwc:if={error}>
      <div class="sec"><div class="note bad">{error}</div></div>
    </template>

    <!-- ============ a surgeon (person account) ============ -->
    <template lwc:if={isPerson}>
      <div class="sec">
        <h3>
          Rating by portfolio <span class="sp"></span
          ><span class="tag">stored on the account</span>
        </h3>
        <div class="ratbox">
          <div class="ratings">
            <template for:each={plates} for:item="p">
              <div key={p.key} class={p.cls} role="img" aria-label={p.label}>
                <div class="txt">
                  <div class="area">{p.area}</div>
                  <div class="rank">{p.rank}</div>
                  <div class="stars">
                    <template for:each={p.starList} for:item="st">
                      <svg
                        key={st.key}
                        viewBox="1.5 1.6 21 20"
                        aria-hidden="true"
                      >
                        <path
                          d="M12 2l3 6.8 7.4.7-5.6 4.9 1.7 7.3L12 17.9 5.5 21.7l1.7-7.3L1.6 9.5l7.4-.7z"
                        ></path>
                      </svg>
                    </template>
                  </div>
                </div>
                <div class="coin">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                      d="M12 2l3 6.8 7.4.7-5.6 4.9 1.7 7.3L12 17.9 5.5 21.7l1.7-7.3L1.6 9.5l7.4-.7z"
                    ></path>
                  </svg>
                </div>
              </div>
            </template>
          </div>
        </div>
        <div class={ratingNote.cls} lwc:if={ratingNote}>{ratingNote.text}</div>
      </div>

      <div class="sec">
        <h3>
          What this surgeon uses <span class="sp"></span>
          <button
            lwc:if={canAdd}
            class="btn"
            type="button"
            onclick={handleAddToggle}
          >
            {addToggleLabel}
          </button>
        </h3>

        <div class={foldCls} lwc:if={canAdd}>
          <div class="in">
            <div class="addbox">
              <div class="addgrid">
                <div class="fld">
                  <label>Hospital</label>
                  <template lwc:if={hasHospital}>
                    <span class="chosen"
                      >{hospitalName}
                      <button
                        class="xcirc"
                        type="button"
                        aria-label="Remove the hospital"
                        onclick={handleHospitalClear}
                      ></button
                    ></span>
                  </template>
                  <template lwc:else>
                    <span class={sboxCls}>
                      <input
                        type="text"
                        placeholder="Search hospitals"
                        autocomplete="off"
                        value={search}
                        oninput={handleSearch}
                      />
                      <button
                        class="xcirc sclear"
                        type="button"
                        aria-label="Clear the search"
                        onclick={handleSearchClear}
                      ></button>
                      <div class="pick" lwc:if={showHits}>
                        <template for:each={hits} for:item="h">
                          <div
                            key={h.id}
                            class="opt"
                            data-id={h.id}
                            data-name={h.name}
                            onclick={handlePick}
                          >
                            {h.name}<small>{h.sub}</small>
                          </div>
                        </template>
                        <div class="opt none" lwc:if={noHits}>
                          No hospital found
                        </div>
                      </div>
                    </span>
                  </template>
                </div>
                <div class="fld">
                  <label>Portfolio</label>
                  <div class="modeswitch">
                    <c-pipeline-segmented
                      label="Portfolio of the new usage"
                      options={portfolioOptions}
                      value={addPortfolio}
                      onchange={handleAddPortfolio}
                    ></c-pipeline-segmented>
                  </div>
                </div>
              </div>
              <template lwc:if={addTile}>
                <c-pipeline-usage-tile
                  tile={addTile}
                  onfieldchange={handleTileField}
                  onchip={handleTileChip}
                ></c-pipeline-usage-tile>
              </template>
              <div class="note bad" lwc:if={addMsg}>{addMsg}</div>
              <div class="addfoot">
                <button
                  class="btn"
                  type="button"
                  disabled={addDisabled}
                  onclick={handleAddDo}
                >
                  Save
                </button>
                <button
                  class="btn sec2"
                  type="button"
                  onclick={handleAddToggle}
                >
                  Cancel
                </button>
                <span class="foot"
                  >One usage per surgeon, hospital, portfolio and company.</span
                >
              </div>
            </div>
          </div>
        </div>

        <div class={rowMsgCls} lwc:if={rowMsg}>{rowMsg}</div>

        <template lwc:if={noUsages}>
          <div class="empty">No usages recorded for this surgeon yet.</div>
        </template>
        <template lwc:else>
          <div class="tiles">
            <div class="cgh">
              <div></div>
              <div></div>
              <template for:each={columnHeads} for:item="h">
                <div key={h}>{h}</div>
              </template>
              <div class="xh">Procedures and technologies</div>
              <div class="luh">Last updated</div>
              <div></div>
            </div>
            <template for:each={groups} for:item="g">
              <div key={g.hospital} class="uhosp">{g.hospital}</div>
              <template for:each={g.tiles} for:item="t">
                <c-pipeline-usage-tile
                  key={t.key}
                  tile={t}
                  onedit={handleTileEdit}
                  oncancel={handleTileCancel}
                  onfieldchange={handleTileField}
                  onchip={handleTileChip}
                  onsave={handleTileSave}
                  ondelete={handleTileDelete}
                  ondeleteno={handleTileDeleteNo}
                  ondeleteyes={handleTileDeleteYes}
                ></c-pipeline-usage-tile>
              </template>
            </template>
          </div>
        </template>
      </div>

      <div class="sec" lwc:if={showBookings}>
        <template lwc:if={noBookings}>
          <h3 class="solo">
            MyCase: there were 0 MyCase bookings in the last 12 months
            <span class="sp"></span
            ><span class="tag">for information only</span>
          </h3>
        </template>
        <template lwc:else>
          <h3>
            MyCase bookings, last 12 months <span class="sp"></span
            ><span class="tag">for information only</span>
          </h3>
          <table>
            <thead>
              <tr>
                <th>Surgery type</th>
                <th class="num">Primary</th>
                <th class="num">Revision</th>
                <th class="num">Total</th>
                <th class="num">Latest booking</th>
              </tr>
            </thead>
            <tbody>
              <template for:each={bookingRows} for:item="b">
                <tr key={b.type}>
                  <td>{b.type}</td>
                  <template lwc:if={b.none}>
                    <td class="num dash">–</td>
                    <td class="num dash">–</td>
                    <td class="num dash">–</td>
                    <td class="num dash">–</td>
                  </template>
                  <template lwc:else>
                    <td class="num">{b.primary}</td>
                    <td class="num">{b.revision}</td>
                    <td class="num"><b>{b.total}</b></td>
                    <td class="num">{b.latest}</td>
                  </template>
                </tr>
              </template>
              <tr class="total">
                <td>All types</td>
                <td class="num">{bookingTotals.primary}</td>
                <td class="num">{bookingTotals.revision}</td>
                <td class="num">{bookingTotals.total}</td>
                <td class="num"></td>
              </tr>
            </tbody>
          </table>
          <div class="foot">
            Surgeries booked in MyCase with usage items, past dates only. Shown
            so you can see what this surgeon is doing now; nothing here can be
            changed.
          </div>
        </template>
      </div>
    </template>

    <!-- ============ a hospital (business account) ============ -->
    <template lwc:if={isHospital}>
      <div class="sec">
        <template lwc:if={noSurgeons}>
          <div class="empty">
            No surgeons to show for this hospital in this view.
          </div>
        </template>
        <template lwc:else>
          <table class="hosp">
            <thead>
              <template lwc:if={splitView}>
                <tr>
                  <th rowspan="2" class="bottom">Surgeon</th>
                  <template for:each={splitHeads} for:item="h">
                    <th key={h.t} class="num grp" colspan="2">{h.t}</th>
                  </template>
                </tr>
                <tr>
                  <template for:each={splitSubs} for:item="h">
                    <th key={h.k} class={h.cls}>{h.t}</th>
                  </template>
                </tr>
              </template>
              <template lwc:else>
                <tr>
                  <th>Surgeon</th>
                  <template for:each={typeHeads} for:item="h">
                    <th key={h.t} class="num">{h.t}</th>
                  </template>
                  <th class="num">Total</th>
                </tr>
              </template>
            </thead>
            <tbody>
              <template for:each={hospitalRows} for:item="r">
                <tr key={r.id}>
                  <td>
                    <a class="lnk" data-id={r.id} onclick={handleGo}
                      >{r.name}</a
                    >
                  </td>
                  <template for:each={r.cells} for:item="c">
                    <td key={c.k} class={c.cls}>{c.v}</td>
                  </template>
                </tr>
              </template>
              <tr class="total">
                <td>All surgeons</td>
                <template for:each={hospitalTotals} for:item="c">
                  <td key={c.k} class={c.cls}>{c.v}</td>
                </template>
              </tr>
            </tbody>
          </table>
          <div class="foot">{hospitalFoot}</div>
        </template>
      </div>
    </template>

    <div class="wait" lwc:if={busy}><span>Please wait…</span></div>
  </div>
</template>
