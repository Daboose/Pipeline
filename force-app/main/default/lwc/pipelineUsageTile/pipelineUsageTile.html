<template>
  <div class={tile.cls}>
    <div class="ush" lwc:if={tile.showHead}>
      <b>{tile.title}</b>
      <span class="sp"></span>
      <template lwc:if={tile.showActions}>
        <button
          class="ib"
          type="button"
          aria-label="Edit this usage"
          title="Edit"
          onclick={handleEdit}
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path>
          </svg>
        </button>
        <button
          lwc:if={tile.canDelete}
          class="iconbtn del"
          type="button"
          onclick={handleDelete}
        >
          Delete
        </button>
      </template>
    </div>

    <div class="confirm" lwc:if={tile.deleting}>
      <b>{tile.delText}</b> This takes it off the surgeon.
      <span class="sp"></span>
      <button class="btn danger" type="button" onclick={handleDeleteYes}>
        Delete
      </button>
      <button class="btn sec2" type="button" onclick={handleDeleteNo}>
        Keep
      </button>
    </div>

    <div class="grid" style={tile.gridStyle} lwc:if={tile.hasGrid}>
      <div lwc:if={tile.hasLabel}></div>
      <template for:each={tile.heads} for:item="h">
        <div key={h.key} class="gh">
          {h.text}<span class="rq" lwc:if={h.star}>*</span>
        </div>
      </template>
      <template for:each={tile.rows} for:item="r">
        <div key={r.key} class={r.cls} lwc:if={r.hasLabel}>
          {r.label}<span class="rq" lwc:if={r.star}>*</span>
        </div>
        <template for:each={r.cells} for:item="c">
          <div key={c.key} class="gh" lwc:if={c.isHead}>{c.text}</div>
          <div key={c.key} class="gx" style={c.style} lwc:elseif={c.isGap}>
            {c.hint}
          </div>
          <div key={c.key} class={c.cls} lwc:else>
            <div class="v" lwc:if={c.isText}>{c.text}</div>
            <select
              lwc:elseif={c.isSelect}
              class={c.selCls}
              data-field={c.field}
              disabled={c.disabled}
              onchange={handleField}
            >
              <template for:each={c.options} for:item="o">
                <option key={o.value} value={o.value} selected={o.selected}>
                  {o.label}
                </option>
              </template>
            </select>
            <input
              lwc:else
              class={c.inputCls}
              type="text"
              inputmode="numeric"
              data-field={c.field}
              value={c.value}
              disabled={c.disabled}
              oninput={handleNumber}
            />
          </div>
        </template>
      </template>
    </div>

    <div class="chips" lwc:if={tile.hasChips}>
      <template for:each={tile.proc} for:item="c">
        <button
          key={c.key}
          class={c.cls}
          type="button"
          data-field={c.field}
          data-v={c.value}
          onclick={handleChip}
          lwc:if={tile.editable}
        >
          {c.label}
        </button>
        <span key={c.key} class={c.cls} lwc:else>{c.label}</span>
      </template>
      <span class="gap" lwc:if={tile.chipGap}></span>
      <template for:each={tile.tech} for:item="c">
        <button
          key={c.key}
          class={c.cls}
          type="button"
          data-field={c.field}
          data-v={c.value}
          onclick={handleChip}
          lwc:if={tile.editable}
        >
          {c.label}
        </button>
        <span key={c.key} class={c.cls} lwc:else>{c.label}</span>
      </template>
    </div>

    <div class="tfoot" lwc:if={tile.showFoot}>
      <button class="btn sec2" type="button" onclick={handleCancel}>
        Cancel
      </button>
      <button
        class="btn"
        type="button"
        disabled={tile.saveDisabled}
        onclick={handleSave}
      >
        Save
      </button>
    </div>
  </div>
</template>
