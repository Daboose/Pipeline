<template>
  <div class={tile.cls}>
    <div class="confirm" lwc:if={tile.deleting}>
      <b>{tile.delText}</b> This takes it off the surgeon.
      <span class="sp"></span>
      <button class="btn danger" type="button" onclick={handleDeleteYes}>
        Delete
      </button>
      <button class="btn sec2" type="button" onclick={handleDeleteNo}>
        Keep
      </button>
    </div>

    <div class="cg" lwc:if={tile.hasGrid}>
      <template for:each={tile.cells} for:item="c">
        <div key={c.key} class={c.cls} style={c.style}>
          <template lwc:if={c.isText}
            >{c.text}<span class="rq" lwc:if={c.star}>*</span></template
          >
          <select
            lwc:elseif={c.isSelect}
            class={c.selCls}
            aria-label={c.placeholder}
            data-field={c.field}
            disabled={c.disabled}
            onchange={handleField}
          >
            <template for:each={c.options} for:item="o">
              <option key={o.value} value={o.value} selected={o.selected}>
                {o.label}
              </option>
            </template>
          </select>
          <input
            lwc:else
            class={c.inputCls}
            type="text"
            inputmode="numeric"
            placeholder={c.placeholder}
            aria-label={c.placeholder}
            data-field={c.field}
            value={c.value}
            disabled={c.disabled}
            oninput={handleNumber}
          />
        </div>
      </template>

      <template lwc:if={tile.showSide}>
        <div class="xc" style={tile.sideStyle}>
          <template for:each={tile.proc} for:item="c">
            <span key={c.key} class={c.cls}>{c.label}</span>
          </template>
          <span class="gap" lwc:if={tile.chipGap}></span>
          <template for:each={tile.tech} for:item="c">
            <span key={c.key} class={c.cls}>{c.label}</span>
          </template>
        </div>
        <div class={tile.lastCls} style="grid-row: 1">{tile.lastText}</div>
        <div class="pe" style={tile.sideStyle}>
          <template lwc:if={tile.showActions}>
            <button
              class="ib"
              type="button"
              aria-label="Edit this usage"
              title="Edit"
              onclick={handleEdit}
            >
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M12 20h9"></path>
                <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path>
              </svg>
            </button>
            <button
              lwc:if={tile.canDelete}
              class="iconbtn del"
              type="button"
              onclick={handleDelete}
            >
              Delete
            </button>
          </template>
        </div>
      </template>

      <div class="chips" lwc:if={tile.showEditChips}>
        <template for:each={tile.proc} for:item="c">
          <button
            key={c.key}
            class={c.cls}
            type="button"
            data-field={c.field}
            data-v={c.value}
            onclick={handleChip}
          >
            {c.label}
          </button>
        </template>
        <span class="gap" lwc:if={tile.chipGap}></span>
        <template for:each={tile.tech} for:item="c">
          <button
            key={c.key}
            class={c.cls}
            type="button"
            data-field={c.field}
            data-v={c.value}
            onclick={handleChip}
          >
            {c.label}
          </button>
        </template>
      </div>
    </div>

    <div class="tfoot" lwc:if={tile.showFoot}>
      <button class="btn sec2" type="button" onclick={handleCancel}>
        Cancel
      </button>
      <button
        class="btn"
        type="button"
        disabled={tile.saveDisabled}
        onclick={handleSave}
      >
        Save
      </button>
    </div>
  </div>
</template>
