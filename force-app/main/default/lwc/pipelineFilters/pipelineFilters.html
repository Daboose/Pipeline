<template>
  <div class={scrimCls} onclick={handleClose}></div>
  <section class={panelCls} role="dialog" aria-label="My filters">
    <div class="fhead">
      <c-pipeline-pipe variant="wide" a="MY" b="FILTERS"></c-pipeline-pipe>
      <span class="sp"></span>
      <button
        type="button"
        class="xcirc xbig"
        onclick={handleClose}
        aria-label="Close"
        title="Close"
      ></button>
    </div>

    <div class="fbody">
      <div class="fsub">
        Click a name to run it. The star marks the one Pipeline opens on.
      </div>
      <div class="empty" lwc:if={noFilters}>
        You have no saved filters yet. Choose what you want to look at, then
        save it below.
      </div>
      <template for:each={rows} for:item="f">
        <div class={f.cls} key={f.id}>
          <div class="fline">
            <div class="fedit" lwc:if={f.renaming}>
              <input
                class="in"
                type="text"
                maxlength="80"
                value={renameValue}
                oninput={handleRenameInput}
                onkeydown={handleRenameKey}
              />
              <button
                type="button"
                class="tick"
                data-id={f.id}
                onclick={handleRenameKeep}
                disabled={cantRename}
                aria-label="Keep the new name"
                title="Keep the new name"
              ></button>
              <button
                type="button"
                class="xcirc"
                onclick={handleRenameCancel}
                aria-label="Cancel"
                title="Cancel"
              ></button>
            </div>
            <div class="confirm" lwc:elseif={f.deleting}>
              <span>Delete “{f.name}”?</span>
              <button
                type="button"
                class="btn danger small"
                data-id={f.id}
                onclick={handleDeleteYes}
              >
                Delete
              </button>
              <button
                type="button"
                class="btn sec small"
                onclick={handleDeleteNo}
              >
                Keep
              </button>
            </div>
            <template lwc:else>
              <button
                type="button"
                class="fname"
                data-id={f.id}
                onclick={handleRun}
              >
                <b
                  >{f.name}<span lwc:if={f.active} class="tag now"
                    >Showing now</span
                  ><span lwc:if={f.showChanged} class="tag chg"
                    >Changed</span
                  ></b
                >
                <small>{f.summary}</small>
              </button>
              <button
                type="button"
                class={f.starCls}
                data-id={f.id}
                onclick={handleStar}
                title={f.starTitle}
                aria-label={f.starTitle}
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M12 3l2.7 5.7 6.3.8-4.6 4.3 1.2 6.2L12 17l-5.6 3 1.2-6.2L3 9.5l6.3-.8z"
                  ></path>
                </svg>
              </button>
              <button
                type="button"
                class="ib"
                data-id={f.id}
                onclick={handleRenameOpen}
                title="Rename"
                aria-label="Rename"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19z"></path>
                  <path d="M14.5 6.5l3 3"></path>
                </svg>
              </button>
              <button
                type="button"
                class="ib"
                data-id={f.id}
                onclick={handleShareOpen}
                title="Share"
                aria-label="Share"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="9" cy="8" r="3.2"></circle>
                  <path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"></path>
                  <circle cx="17.5" cy="9" r="2.5"></circle>
                  <path d="M17 14c2.5.2 4.5 2 4.5 5"></path>
                </svg>
              </button>
              <button
                type="button"
                class="ib del"
                data-id={f.id}
                onclick={handleDeleteAsk}
                title="Delete"
                aria-label="Delete"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M4 7h16M10 7V4h4v3M6 7l1 13h10l1-13M10 11v6M14 11v6"
                  ></path>
                </svg>
              </button>
            </template>
          </div>

          <div class="share" lwc:if={f.sharing}>
            <div class="hint">
              Sharing gives the other person their own copy to keep, change or
              delete.
            </div>
            <div class="sbox">
              <input
                class="in"
                type="text"
                placeholder="Find a person by name"
                value={term}
                oninput={handleTerm}
              />
              <button
                type="button"
                class="xcirc sclear"
                lwc:if={term}
                onclick={handleTermClear}
                aria-label="Clear the search"
                title="Clear the search"
              ></button>
            </div>
            <div class="people">
              <template for:each={results} for:item="p">
                <button
                  type="button"
                  class={p.cls}
                  key={p.id}
                  data-id={p.id}
                  onclick={handlePerson}
                >
                  {p.name}<small>{p.title}</small>
                </button>
              </template>
            </div>
            <div class="acts">
              <button
                type="button"
                class="btn small"
                data-id={f.id}
                onclick={handleShareSend}
                disabled={cantShare}
              >
                Share with {chosenText}
              </button>
              <button
                type="button"
                class="btn sec small"
                data-id={f.id}
                onclick={handleShareTeam}
                disabled={busy}
                lwc:if={isManager}
              >
                Share with my whole team
              </button>
              <button
                type="button"
                class="btn sec small"
                onclick={handleShareClose}
              >
                Cancel
              </button>
            </div>
          </div>
        </div>
      </template>
    </div>

    <div class="ffoot">
      <div class="cur">On screen now: <b>{screenSummary}</b></div>
      <div class="acts">
        <template lwc:if={saving}>
          <input
            class="in name"
            type="text"
            maxlength="80"
            placeholder="Name this filter"
            value={name}
            oninput={handleName}
            onkeydown={handleNameKey}
          />
          <button
            type="button"
            class="btn small"
            onclick={handleSaveNew}
            disabled={cantSave}
          >
            Save
          </button>
          <button
            type="button"
            class="btn sec small"
            onclick={handleSaveCancel}
          >
            Cancel
          </button>
        </template>
        <template lwc:else>
          <button type="button" class="btn sec" onclick={handleSaveOpen}>
            Save as new filter…
          </button>
          <button
            type="button"
            class="btn"
            lwc:if={activeName}
            onclick={handleSaveOver}
            disabled={cantOver}
            title={overTitle}
          >
            {overText}
          </button>
        </template>
        <span class="msg ok" lwc:if={message}>{message}</span>
        <span class="msg bad" lwc:if={error}>{error}</span>
      </div>
    </div>
  </section>
</template>
