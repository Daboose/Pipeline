<template>
  <div class="root" data-theme={theme} data-head={headColour}>
    <header class="top">
      <span class="word"
        ><span class="pipe">SALES</span
        ><span class="line">CAMPAIGN MANAGEMENT</span></span
      >
      <span class="ver">{version}</span>
      <span class="sp"></span>
      <div class="actions" lwc:if={ready}>
        <template lwc:if={isList}>
          <button
            type="button"
            class="btn"
            lwc:if={canManage}
            onclick={handleNew}
          >
            New campaign
          </button>
        </template>
        <template lwc:elseif={isDetail}>
          <button
            type="button"
            class="btn"
            lwc:if={canManage}
            onclick={handleEdit}
          >
            Edit campaign
          </button>
          <button
            type="button"
            class={toggleActiveCls}
            lwc:if={canManage}
            onclick={handleToggleActive}
          >
            {toggleActiveText}
          </button>
          <button
            type="button"
            class="btn danger"
            lwc:if={canManage}
            onclick={handleDelete}
          >
            Delete campaign
          </button>
        </template>
      </div>
      <c-pipeline-segmented
        class="themeseg"
        heading="Theme"
        label="Theme"
        options={themeOptions}
        value={theme}
        onchange={handleThemePick}
      ></c-pipeline-segmented>
      <button
        type="button"
        class="icb"
        title="Full screen"
        aria-label="Full screen"
        onclick={handleFullScreen}
      >
        <svg
          viewBox="0 0 24 24"
          width="20"
          height="20"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path>
        </svg>
      </button>
    </header>

    <div class="err" lwc:if={error}>{error}</div>

    <main class="main" lwc:if={ready}>
      <!-- ============ the list ============ -->
      <template lwc:if={isList}>
        <div class="toolrow">
          <div class="fwrap fsrch">
            <span class="fslbl">Search</span>
            <span class="ffield">
              <input
                class="fin"
                type="text"
                placeholder="Campaign name"
                aria-label="Search campaigns"
                value={q}
                oninput={handleQ}
              />
              <button
                type="button"
                class="xcirc fclear"
                lwc:if={hasQ}
                aria-label="Clear"
                onclick={handleQClear}
              ></button>
            </span>
          </div>
          <div class="fwrap">
            <span class="fslbl">Manager</span>
            <span class="ffield">
              <select aria-label="Manager" onchange={handleFManager}>
                <template for:each={managerOptions} for:item="o">
                  <option key={o.value} value={o.value} selected={o.selected}>
                    {o.label}
                  </option>
                </template>
              </select>
            </span>
          </div>
          <div class="fwrap">
            <span class="fslbl">Country</span>
            <span class="ffield">
              <select aria-label="Country" onchange={handleFCountry}>
                <template for:each={countryOptions} for:item="o">
                  <option key={o.value} value={o.value} selected={o.selected}>
                    {o.label}
                  </option>
                </template>
              </select>
            </span>
          </div>
          <div class="fwrap">
            <span class="fslbl">Portfolio</span>
            <span class="ffield">
              <select aria-label="Portfolio" onchange={handleFPortfolio}>
                <template for:each={portfolioOptions} for:item="o">
                  <option key={o.value} value={o.value} selected={o.selected}>
                    {o.label}
                  </option>
                </template>
              </select>
            </span>
          </div>
          <c-pipeline-segmented
            class="showseg"
            heading="Show"
            label="Show"
            options={showOptions}
            value={showValue}
            onchange={handleShowPick}
          ></c-pipeline-segmented>
          <button
            type="button"
            class="btn sec"
            lwc:if={filtersOn}
            onclick={handleClearFilters}
          >
            Clear filters
          </button>
          <span class="sp"></span>
          <span class="muted">{listCountText}</span>
        </div>
        <p class="ok" lwc:if={hasToast}>{toast}</p>
        <p class="note" lwc:if={cannotManage}>
          You can look at the campaigns here. Creating and changing them needs
          the Campaign Manager permission.
        </p>
        <div class="card full tablecard">
          <div class="tscroll stick">
            <table class="tbl" style={listTableStyle}>
              <colgroup lwc:if={listHasWidths}>
                <template for:each={listCols} for:item="c">
                  <col key={c.id} style={c.style} />
                </template>
              </colgroup>
              <thead>
                <tr>
                  <template for:each={listHeads} for:item="h">
                    <th
                      key={h.id}
                      class={h.cls}
                      data-table="list"
                      data-id={h.id}
                    >
                      <span
                        class="lab2"
                        data-table="list"
                        data-id={h.id}
                        onclick={handleSort}
                        title="Click to sort"
                        >{h.label}<span class="arrow">{h.arrow}</span></span
                      >
                      <i
                        class="rz"
                        data-table="list"
                        data-id={h.id}
                        title="Drag to resize. Double-click to reset the widths."
                        onmousedown={handleResizeStart}
                        ondblclick={handleWidthsReset}
                      ></i>
                    </th>
                  </template>
                </tr>
              </thead>
              <tbody>
                <template for:each={listRows} for:item="c">
                  <tr
                    key={c.id}
                    class="click"
                    data-id={c.id}
                    onclick={handleOpen}
                  >
                    <td class="strong">{c.name}</td>
                    <td class="caps">{c.portfoliosText}</td>
                    <td>{c.countriesText}</td>
                    <td>{c.managerName}</td>
                    <td><span class={c.statusCls}>{c.statusText}</span></td>
                    <td class="num">{c.memberCount}</td>
                    <td class="num">{c.dealCount}</td>
                  </tr>
                </template>
                <tr lwc:if={noRows}>
                  <td colspan="7" class="empty">No campaigns to show.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
        <p class="note">
          Inactive campaigns are hidden unless you show them, and deals cannot
          be linked to them. Click a campaign to open it.
        </p>
      </template>

      <!-- ============ the form ============ -->
      <template lwc:elseif={isForm}>
        <h1 class="head1 trail">
          <template for:each={crumbs} for:item="c">
            <span key={c.key} class="crumb">
              <button
                type="button"
                class="crumblink"
                lwc:if={c.link}
                data-target={c.target}
                onclick={handleCrumb}
              >
                {c.label}
              </button>
              <span class="crumbhere" lwc:else>{c.label}</span>
            </span>
          </template>
        </h1>
        <div class="card full formcard">
          <div class="nameblock">
            <span class="lab first"
              >Campaign name (set automatically, cannot be typed)</span
            >
            <div class="nameprev">
              {namePreview}<span class="lock">LOCKED</span>
            </div>
          </div>
          <ul class="problems" lwc:if={hasProblems}>
            <template for:each={problemItems} for:item="p">
              <li key={p.key}>{p.text}</li>
            </template>
          </ul>
          <div class="cols">
            <div class="col">
              <label class="lab first" for="fname">Friendly name</label>
              <div class="row">
                <input
                  id="fname"
                  class="in wide"
                  type="text"
                  maxlength={nameLimit}
                  value={form.friendlyName}
                  oninput={handleName}
                  placeholder="For example: Shoulder Sydney Meeting"
                />
                <span class="count">{nameCount}</span>
              </div>
              <span class="lab">Countries (one or many)</span>
              <div class="chips">
                <template for:each={countryChips} for:item="c">
                  <button
                    key={c.value}
                    type="button"
                    class={c.cls}
                    data-v={c.value}
                    onclick={handleCountry}
                  >
                    {c.label}
                  </button>
                </template>
              </div>
              <span class="lab">Portfolios (one or many)</span>
              <div class="chips">
                <template for:each={portfolioChips} for:item="p">
                  <button
                    key={p.value}
                    type="button"
                    class={p.cls}
                    data-v={p.value}
                    onclick={handlePortfolio}
                  >
                    {p.label}
                  </button>
                </template>
              </div>
              <span class="lab">What is this campaign for? (optional)</span>
              <textarea class="in area" onchange={handleDesc}></textarea>
            </div>
            <div class="col">
              <span class="lab first">Campaign manager</span>
              <div class="rel">
                <span class="sbox big">
                  <input
                    class="in search"
                    type="text"
                    placeholder="Search for a person"
                    value={managerShown}
                    oninput={handleMgrInput}
                  />
                  <button
                    type="button"
                    class="xcirc sclear"
                    lwc:if={hasManagerText}
                    aria-label="Clear"
                    onclick={handleMgrClear}
                  ></button>
                </span>
                <div class="pop" lwc:if={showMgrPop}>
                  <template for:each={mgrHits} for:item="m">
                    <button
                      key={m.id}
                      type="button"
                      class="opt"
                      data-id={m.id}
                      data-name={m.name}
                      onclick={handleMgrPick}
                    >
                      {m.name}
                    </button>
                  </template>
                  <div class="foot" lwc:if={mgrShort}>
                    Type at least 2 letters.
                  </div>
                  <div class="foot" lwc:if={mgrNone}>
                    Nobody found. Only active people who work for the company
                    are offered.
                  </div>
                </div>
              </div>
              <span class="lab">Status</span>
              <div class="row">
                <c-pipeline-segmented
                  heading="Status"
                  label="Status"
                  options={statusOptions}
                  value={statusValue}
                  onchange={handleStatusPick}
                ></c-pipeline-segmented>
                <span class="muted">{activeText}</span>
              </div>
              <span class="lab">Start and end (optional)</span>
              <div class="row">
                <input
                  class="in date"
                  type="date"
                  value={form.startDate}
                  onchange={handleStart}
                />
                <span class="muted">to</span>
                <input
                  class="in date"
                  type="date"
                  value={form.endDate}
                  onchange={handleEnd}
                />
              </div>
            </div>
          </div>
          <div class="formactions">
            <button type="button" class="btn sec" onclick={handleCancelForm}>
              Cancel
            </button>
            <button
              type="button"
              class="btn"
              disabled={saveDisabled}
              onclick={handleSave}
            >
              Save campaign
            </button>
          </div>
        </div>
      </template>

      <!-- ============ one campaign ============ -->
      <template lwc:elseif={isDetail}>
        <div class="askbar" lwc:if={deleteAsking}>
          <span>{deleteAskText}</span>
          <span class="sp"></span>
          <button type="button" class="btn sec" onclick={handleDeleteNo}>
            Keep it
          </button>
          <button type="button" class="btn danger" onclick={handleDeleteYes}>
            Yes, delete it
          </button>
        </div>
        <c-pipeline-campaign-members
          campaign={campaign}
          members={detail.members}
          manage={canManage}
          onselectionchange={handleSelection}
        >
          <div slot="heading" class="tl">
            <h1 class="head1 trail">
              <template for:each={crumbs} for:item="c">
                <span key={c.key} class="crumb">
                  <button
                    type="button"
                    class="crumblink"
                    lwc:if={c.link}
                    data-target={c.target}
                    onclick={handleCrumb}
                  >
                    {c.label}
                  </button>
                  <span class="crumbhere" lwc:else>{c.label}</span>
                </span>
              </template>
            </h1>
            <div class="row factsrow">
              <span class={statusTag}>{statusText}</span>
              <span class="facts caps">{facts}</span>
            </div>
            <p class="note" lwc:if={hasActiveNote}>{activeNote}</p>
          </div>
          <div slot="tools" class="toolwrap" lwc:if={canManage}>
            <span class="rel" lwc:if={canManage}>
              <span class="sbox big">
                <input
                  class="in search"
                  type="text"
                  placeholder="Type a surgeon's name to add them"
                  value={memberQ}
                  oninput={handleMemberQ}
                />
                <button
                  type="button"
                  class="xcirc sclear"
                  lwc:if={hasMemberQ}
                  aria-label="Clear"
                  onclick={handleMemberQClear}
                ></button>
              </span>
              <div class="pop" lwc:if={showSearch}>
                <div class="foot" lwc:if={searchShort}>
                  Type at least 2 characters. The name or the English name both
                  work.
                </div>
                <template for:each={hits} for:item="h">
                  <button
                    key={h.key}
                    type="button"
                    class="opt"
                    data-id={h.id}
                    disabled={h.disabled}
                    onclick={handleAdd}
                  >
                    {h.nameText}<span lwc:if={h.already}>
                      (already a member)</span
                    >
                    <small>{h.sub}</small>
                  </button>
                </template>
                <div class="foot" lwc:if={noHits}>
                  No physician or emerging consultant matches.
                </div>
                <div class="foot" lwc:if={outsideText}>{outsideText}</div>
                <div class="foot" lwc:if={heldBackText}>{heldBackText}</div>
                <div class="foot scope" lwc:if={search}>
                  <span>{scopeText}</span>
                  <button type="button" class="btn small" onclick={handleWiden}>
                    {widenText}
                  </button>
                </div>
              </div>
            </span>
            <button
              type="button"
              class="btn"
              lwc:if={canManage}
              onclick={handleImport}
            >
              Import members
            </button>
          </div>
          <div slot="remove" class="toolwrap" lwc:if={showRemoveButton}>
            <button
              type="button"
              class="btn danger"
              lwc:if={canManage}
              disabled={removeDisabled}
              onclick={handleRemove}
            >
              {removeText}
            </button>
          </div>
          <div slot="ask" class="askwrap">
            <div class="askrow" lwc:if={showRemoveAsk}>
              <span>{removeAskText}</span>
              <span class="sp"></span>
              <button type="button" class="btn sec" onclick={handleRemoveNo}>
                Keep them
              </button>
              <button
                type="button"
                class="btn danger"
                onclick={handleRemoveYes}
              >
                {removeYesText}
              </button>
            </div>
            <p class="ok pad" lwc:if={hasToast}>{toast}</p>
          </div>
        </c-pipeline-campaign-members>
        <p class="note" lwc:if={truncated}>
          Only the first 2,000 members are shown.
        </p>
      </template>

      <!-- ============ import: paste or file ============ -->
      <template lwc:elseif={isImport}>
        <h1 class="head1 trail">
          <template for:each={crumbs} for:item="c">
            <span key={c.key} class="crumb">
              <button
                type="button"
                class="crumblink"
                lwc:if={c.link}
                data-target={c.target}
                onclick={handleCrumb}
              >
                {c.label}
              </button>
              <span class="crumbhere" lwc:else>{c.label}</span>
            </span>
          </template>
        </h1>
        <div class="card full formcard">
          <span class="lab first"
            >Paste a list of surgeons, one per line, straight from Excel</span
          >
          <textarea
            class="in area big"
            placeholder="Wei Ming Lim, SGH&#10;Priya Nair - Mount Elizabeth&#10;Dr Siti Abdullah"
            oninput={handlePaste}
          ></textarea>
          <p class="note">
            Add the hospital after the name (a comma, a dash or a tab) to help
            with common names. Titles such as Dr are ignored, and so is the
            order of the words. The English name is searched too. Nothing is
            saved on this step: the next screen shows what each name matched,
            and you confirm every row.
          </p>
          <span class="lab">...or choose a file (CSV or text)</span>
          <input
            type="file"
            accept=".csv,.txt,.tsv,text/csv,text/plain"
            onchange={handleFile}
          />
          <div class="formactions">
            <span class="muted counttext"
              >{pasteCountText} (up to {maxLines} at a time)</span
            >
            <span class="cleannote" lwc:if={hasCleanNote}>{cleanNote}</span>
            <span class="sp"></span>
            <button
              type="button"
              class="btn sec"
              onclick={handleBackToCampaign}
            >
              Cancel
            </button>
            <button
              type="button"
              class="btn"
              disabled={pasteDisabled}
              onclick={handleCheckNames}
            >
              Check names
            </button>
          </div>
        </div>
      </template>

      <!-- ============ import: the check screen ============ -->
      <template lwc:elseif={isReconcile}>
        <div class="topband">
          <div class="tl">
            <h1 class="head1 trail">
              <template for:each={crumbs} for:item="c">
                <span key={c.key} class="crumb">
                  <button
                    type="button"
                    class="crumblink"
                    lwc:if={c.link}
                    data-target={c.target}
                    onclick={handleCrumb}
                  >
                    {c.label}
                  </button>
                  <span class="crumbhere" lwc:else>{c.label}</span>
                </span>
              </template>
            </h1>
            <p class="note nomargin">
              Exact matches are ready to go. For every other row, choose the
              person and press Confirm. Only rows with a tick in the Add column
              are added.
              <span class="cleannote" lwc:if={hasCleanNote}>{cleanNote}</span>
            </p>
          </div>
          <div class="kpis">
            <div class="kpi">
              <b>{reconCounts.exact}</b><span>Exact matches</span>
            </div>
            <div class="kpi">
              <b>{reconCounts.choose}</b><span>Need a choice</span>
            </div>
            <div class="kpi gap">
              <b>{reconCounts.none}</b><span>Not found</span>
            </div>
            <div class="kpi">
              <b>{reconCounts.dup}</b><span>Already members</span>
            </div>
          </div>
        </div>
        <div class="unsaved" lwc:if={unsaved}>
          <div class="utext" lwc:if={leaveAsking}>
            <b>LEAVE WITHOUT ADDING?</b>
            <span>Your choices on this page will be lost.</span>
          </div>
          <div class="utext" lwc:else>
            <b>NOT SAVED YET</b>
            <span>{unsavedText}</span>
            <span class="ucount">{tickedText}</span>
          </div>
          <span class="sp"></span>
          <template lwc:if={leaveAsking}>
            <button type="button" class="btn sec" onclick={handleStay}>
              Stay here
            </button>
            <button type="button" class="btn danger" onclick={handleLeave}>
              Leave anyway
            </button>
          </template>
          <template lwc:else>
            <button
              type="button"
              class="btn sec"
              onclick={handleBackToCampaign}
            >
              Cancel
            </button>
            <button
              type="button"
              class="btn"
              disabled={addAllDisabled}
              onclick={handleAddAll}
            >
              {addAllText}
            </button>
          </template>
        </div>
        <div class="card full tablecard">
          <div class="cardhead">
            <h2>Check the names</h2>
          </div>
          <div class="tscroll stick">
            <table class="tbl" style={reconTableStyle}>
              <colgroup lwc:if={reconHasWidths}>
                <template for:each={reconCols} for:item="c">
                  <col key={c.id} style={c.style} />
                </template>
              </colgroup>
              <thead>
                <tr>
                  <th class="tick">Add</th>
                  <template for:each={reconHeads} for:item="h">
                    <th
                      key={h.id}
                      class={h.cls}
                      data-table="recon"
                      data-id={h.id}
                    >
                      <span
                        class="lab2"
                        data-table="recon"
                        data-id={h.id}
                        onclick={handleSort}
                        title="Click to sort"
                        >{h.label}<span class="arrow">{h.arrow}</span></span
                      >
                      <i
                        class="rz"
                        data-table="recon"
                        data-id={h.id}
                        title="Drag to resize. Double-click to reset the widths."
                        onmousedown={handleResizeStart}
                        ondblclick={handleWidthsReset}
                      ></i>
                    </th>
                  </template>
                  <th class="act">Your decision</th>
                </tr>
              </thead>
              <tbody>
                <template for:each={reconRows} for:item="r">
                  <tr key={r.key} class={r.rowCls}>
                    <td class="tick">
                      <input
                        type="checkbox"
                        lwc:if={r.showTick}
                        data-i={r.i}
                        checked={r.ok}
                        disabled={r.tickDisabled}
                        onchange={handleRowOk}
                      />
                    </td>
                    <td>{r.text}</td>
                    <td class="matchcell">
                      <template lwc:if={r.showSelect}>
                        <select
                          class="in"
                          data-i={r.i}
                          onchange={handleRowSelect}
                        >
                          <template for:each={r.options} for:item="o">
                            <option
                              key={o.value}
                              value={o.value}
                              selected={o.selected}
                            >
                              {o.label}
                            </option>
                          </template>
                        </select>
                        <button
                          type="button"
                          class="btn small"
                          data-i={r.i}
                          onclick={handleRowLookup}
                        >
                          None of these? Look up
                        </button>
                      </template>
                      <template lwc:if={r.showName}>
                        <span class="strong">{r.nameText}</span>
                        <button
                          type="button"
                          class="xcirc inline"
                          lwc:if={r.showUnpick}
                          data-i={r.i}
                          aria-label="Choose someone else"
                          onclick={handleRowUnpick}
                        ></button>
                        <button
                          type="button"
                          class="btn small"
                          lwc:if={r.showLookupBtn}
                          data-i={r.i}
                          onclick={handleRowLookup}
                        >
                          Not right? Look up
                        </button>
                      </template>
                      <template lwc:if={r.showLookupBox}>
                        <span class="sbox big">
                          <input
                            class="in search"
                            type="text"
                            placeholder="Look the surgeon up"
                            data-i={r.i}
                            value={r.q}
                            oninput={handleRowQ}
                          />
                          <button
                            type="button"
                            class="xcirc sclear"
                            lwc:if={r.hasQ}
                            data-i={r.i}
                            aria-label="Clear"
                            onclick={handleRowQClear}
                          ></button>
                        </span>
                        <div class="inlinepop" lwc:if={r.popOpen}>
                          <div class="foot" lwc:if={r.popShort}>
                            Type at least 2 characters. The name or the English
                            name both work.
                          </div>
                          <template for:each={r.popHits} for:item="h">
                            <button
                              key={h.key}
                              type="button"
                              class="opt hit"
                              data-i={r.i}
                              data-id={h.id}
                              onclick={handleRowPickFound}
                            >
                              <span class="hn">{h.nameText}</span>
                              <span class="hh">{h.hospitalsText}</span>
                              <span class="hp">{h.placeText}</span>
                              <span class="ht">{h.type}</span>
                            </button>
                          </template>
                          <div class="foot" lwc:if={r.popNone}>
                            Nobody found.
                          </div>
                          <div class="foot bar">
                            <span class="barnote"
                              >{r.popScope} Not in Salesforce yet?</span
                            >
                            <button
                              type="button"
                              class="btn small"
                              data-i={r.i}
                              onclick={handleRowWiden}
                            >
                              {r.wideText}
                            </button>
                            <button
                              type="button"
                              class="btn small"
                              onclick={handleRowCreate}
                            >
                              Create this surgeon
                            </button>
                          </div>
                        </div>
                      </template>
                    </td>
                    <td>{r.hospitals}</td>
                    <td>{r.placeText}</td>
                    <td>
                      <span class={r.statusCls}>{r.statusText}</span
                      ><span class="rownote" lwc:if={r.note}>{r.note}</span>
                    </td>
                    <td class="act">
                      <div class="acts">
                        <span class="slot a">
                          <button
                            type="button"
                            class="btn small"
                            lwc:if={r.showConfirm}
                            data-i={r.i}
                            onclick={handleRowConfirm}
                          >
                            {r.confirmText}
                          </button>
                          <span class="tag ok" lwc:if={r.showReady}
                            >✓ Will be added</span
                          >
                          <span class="tag warn" lwc:if={r.showNeeds}
                            >Choose who</span
                          >
                          <span class="tag off" lwc:if={r.showUndo}
                            >Skipped</span
                          >
                        </span>
                        <span class="slot b">
                          <button
                            type="button"
                            class="btn small sec"
                            lwc:if={r.showDel}
                            data-i={r.i}
                            title="Leave this name out of the import"
                            onclick={handleRowDelete}
                          >
                            Skip
                          </button>
                          <button
                            type="button"
                            class="btn small"
                            lwc:if={r.showUndo}
                            data-i={r.i}
                            onclick={handleRowUndo}
                          >
                            Undo
                          </button>
                        </span>
                      </div>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
          <div class="cardfoot">
            <span class="sp"></span>
            <button
              type="button"
              class="btn sec"
              onclick={handleBackToCampaign}
            >
              Cancel
            </button>
            <button
              type="button"
              class="btn"
              disabled={addAllDisabled}
              onclick={handleAddAll}
            >
              {addAllText}
            </button>
          </div>
        </div>
      </template>
    </main>

    <div class="wait" lwc:if={busy}>
      <div class="spin"></div>
      <span>Please wait…</span>
    </div>
  </div>
</template>
