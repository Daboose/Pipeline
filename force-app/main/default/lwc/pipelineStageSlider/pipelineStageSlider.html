<template>
  <div class={wrapCls} role="group" aria-label="Stage">
    <span class="slbl">Stage</span>
    <div class={trackCls}>
      <div class="pill" lwc:ref="pill" aria-hidden="true"></div>
      <template for:each={items} for:item="item">
        <button
          key={item.value}
          type="button"
          class={item.cls}
          aria-pressed={item.pressed}
          data-value={item.value}
          onclick={handleClick}
        >
          {item.value}
          <span class="tick" lwc:if={item.done} aria-label="finished">
            <svg viewBox="0 0 12 12" aria-hidden="true">
              <path
                d="M2.4 6.6l2.5 2.5 4.7-5.4"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              ></path>
            </svg>
          </span>
        </button>
      </template>
    </div>
  </div>
</template>
