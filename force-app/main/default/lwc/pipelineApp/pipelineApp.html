<template>
  <div class={rootClass} data-theme={theme} data-head={headColour}>
    <header class="top">
      <button
        type="button"
        class="icb"
        onclick={handleSettingsOpen}
        title="Your settings"
        aria-label="Your settings"
      >
        <svg
          viewBox="0 0 24 24"
          width="22"
          height="22"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="3.2"></circle>
          <path
            d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.56-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.01a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.01a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.56 1.03z"
          ></path>
        </svg>
      </button>
      <c-pipeline-pipe
        class="brand"
        variant="logo"
        a="PIPE"
        b="LINE"
      ></c-pipeline-pipe>
      <span class="ver2" lwc:if={asAtText}>{asAtText}</span>
      <span class="sp"></span>
      <c-pipeline-segmented
        class="viewseg"
        lwc:if={showViewToggle}
        label="Screen"
        options={viewOptions}
        value={screen}
        onchange={handleViewPick}
      ></c-pipeline-segmented>
      <span class="sp" lwc:if={showViewToggle}></span>
      <button
        type="button"
        class="fpill"
        lwc:if={ready}
        onclick={handleFiltersToggle}
        aria-haspopup="dialog"
        title="Your filters"
      >
        <span class="fplab">Filter</span>
        <span class="fpfield">
          <span class="fpval">
            <span class="star" lwc:if={filterIsDefault}>★</span>
            <span class="nm">{filterButtonLabel}</span>
            <span class="tag" lwc:if={filterChanged}>Changed</span>
          </span>
        </span>
      </button>
      <button
        type="button"
        class="btn change"
        lwc:if={ready}
        onclick={handleOpenPanel}
      >
        Change selection <span class="chev"></span>
      </button>
      <button
        type="button"
        class={fsCls}
        onclick={handleFullScreen}
        title={fsText}
        aria-label={fsText}
      >
        <svg
          class="i-expand"
          viewBox="0 0 24 24"
          width="22"
          height="22"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path>
        </svg>
        <svg
          class="i-collapse"
          viewBox="0 0 24 24"
          width="22"
          height="22"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"></path>
        </svg>
      </button>
    </header>

    <c-pipeline-bar
      lwc:if={ready}
      filter={filter}
      choices={choices}
      teams={teams}
      is-rep={isRep}
      onkindtoggle={handleKindToggle}
      onstatuspick={handleStatusPick}
      onopenpanel={handleOpenPanel}
    ></c-pipeline-bar>

    <div class="err" lwc:if={error}>{error}</div>

    <main class={screenCls} lwc:if={showCampaignScreen}>
      <p class="err" lwc:if={campaignError}>{campaignError}</p>
      <p class="note" lwc:if={campaignBusy}>Reading the campaign…</p>
      <c-pipeline-campaign-members
        lwc:if={campaignDetail}
        campaign={campaignDetail.campaign}
        members={campaignDetail.members}
      >
        <div slot="heading" class="ctrail">
          <span class="cname">{campaignName}</span>
          <span class={campaignStatusCls}>{campaignStatusText}</span>
          <span class="cfacts">{campaignFacts}</span>
        </div>
      </c-pipeline-campaign-members>
    </main>

    <main class={pipelineMainCls} lwc:if={ready}>
      <div class="note" lwc:if={truncated}>
        More deals match than can be shown. Narrow the choices with Change
        selection.
      </div>

      <div class="dcols" style={dcolsStyle}>
        <template for:each={sections} for:item="s">
          <c-pipeline-type-summary
            key={s.kind}
            kind={s.kind}
            deals={s.deals}
            stage-order={stageOrder}
            summary-open={sumOpen}
            status={filterStatus}
            onsummarytoggle={handleSummaryToggle}
          ></c-pipeline-type-summary>
        </template>
      </div>

      <c-pipeline-team-table
        lwc:if={showTeamTable}
        deals={dealsForPeople}
        kinds={filter.kinds}
        team-names={teamNames}
        selected-owner={filter.ownerId}
        team-picked={teamPicked}
        initial-open={teamStartsOpen}
        widths={teamWidths}
        onwidthschange={handleWidthsChange}
        onpickrep={handlePickRep}
        onteamtoggle={handleTeamToggle}
      ></c-pipeline-team-table>

      <div class="legend">
        <span><span class="tag ok">Current</span> Posted In Last 30 Days</span>
        <span><span class="tag warn">Needs Update</span> 30–90 Days</span>
        <span><span class="tag bad">Very Old</span> Over 90 Days</span>
        <span
          >Stage: <span class="tag bad">Red</span> = No Move In Over 90
          Days</span
        >
        <span><span class="tag hold">On Hold</span> No Warnings</span>
        <span><span class="star">★</span> Rep Priority</span>
        <span><span class="sstar">★</span> State Priority</span>
        <span><span class="cstar">★</span> In Campaign</span>
      </div>

      <template for:each={sections} for:item="s">
        <c-pipeline-type-list
          key={s.kind}
          kind={s.kind}
          deals={s.deals}
          columns={s.columns}
          widths={s.widths}
          initial-open={s.listOpen}
          alt-tint={settings.altTint}
          owner-name={focusRepName}
          oncolumnschange={handleColumnsChange}
          onwidthschange={handleWidthsChange}
          ondealopen={handleDealOpen}
          onlisttoggle={handleListToggle}
        ></c-pipeline-type-list>
      </template>
    </main>

    <c-pipeline-selection
      lwc:if={panelOpen}
      open={panelOn}
      filter={filter}
      choices={choices}
      teams={teams}
      options={options}
      is-manager={isManager}
      campaigns={campaigns}
      start-team={startTeam}
      record-types={recordTypes}
      onapply={handlePanelApply}
      onreset={handlePanelReset}
      oncancel={handlePanelCancel}
    ></c-pipeline-selection>

    <c-pipeline-deal
      lwc:if={flyDeal}
      open={flyOn}
      deal={flyDeal}
      index={flyIndex}
      total={flyTotal}
      is-manager={isManager}
      viewer-id={viewerId}
      onclose={handleDealClose}
      onprev={handleDealPrev}
      onnext={handleDealNext}
      ondealsaved={handleDealSaved}
    ></c-pipeline-deal>

    <div class={settingsScrimCls} onclick={handleSettingsClose}></div>
    <aside
      class={settingsFlyCls}
      aria-hidden={settingsHidden}
      aria-label="Your settings"
    >
      <div class="fhead">
        <c-pipeline-pipe variant="wide" a="YOUR" b="SETTINGS"></c-pipeline-pipe>
        <span class="sp"></span>
        <button
          type="button"
          class="rbtn"
          onclick={handleSettingsClose}
          title="Close"
          aria-label="Close"
        >
          &#10005;
        </button>
      </div>
      <div class="flbl">Look</div>
      <div class="seg" role="group" aria-label="Dark or light">
        <button
          type="button"
          class={darkCls}
          data-theme="dark"
          onclick={handleTheme}
        >
          Dark
        </button>
        <button
          type="button"
          class={lightCls}
          data-theme="light"
          onclick={handleTheme}
        >
          Light
        </button>
      </div>
      <div class="flbl gap">Heading colour</div>
      <div class="hcs" role="group" aria-label="Heading colour">
        <template for:each={headOptions} for:item="h">
          <button
            key={h.key}
            type="button"
            class={h.cls}
            data-head={h.key}
            onclick={handleHeadColour}
          >
            <span class={h.dotCls}></span>{h.label}
          </button>
        </template>
      </div>
      <label class="check">
        <input
          type="checkbox"
          checked={settings.altTint}
          onchange={handleTint}
        />
        <span>Tint every second rep</span>
      </label>
      <div class="ver">Pipeline version {version}</div>
    </aside>

    <c-pipeline-filters
      lwc:if={filtersMounted}
      open={filtersOn}
      filters={filterRows}
      snapshot={snapshot}
      active-id={activeFilterId}
      changed={filterChanged}
      screen-summary={screenSummary}
      is-manager={canShareWithTeam}
      onopenfilter={handleOpenFilter}
      onfilterschanged={handleFiltersChanged}
      onclose={closeFilters}
    ></c-pipeline-filters>

    <div class="busy" lwc:if={busy}>
      <div class="busybox">Please wait…</div>
    </div>
  </div>
</template>
