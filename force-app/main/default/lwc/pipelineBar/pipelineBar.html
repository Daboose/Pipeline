<template>
  <div class="bar">
    <div class="ktogs">
      <template for:each={kindButtons} for:item="k">
        <button
          type="button"
          key={k.kind}
          class={k.cls}
          data-kind={k.kind}
          onclick={handleKind}
          aria-pressed={k.on}
        >
          <span>{k.label}</span><span class="kbox"></span>
        </button>
      </template>
    </div>

    <div class="status">
      <c-pipeline-segmented
        heading="Status"
        label="Open, Closed or Both"
        options={statusOptions}
        value={statusValue}
        onchange={handleStatus}
      ></c-pipeline-segmented>
    </div>

    <div class="chips">
      <template for:each={chips} for:item="c">
        <span class="chip" key={c.key}
          ><i lwc:if={c.label}>{c.label}</i>{c.text}</span
        >
      </template>
    </div>
  </div>
</template>
