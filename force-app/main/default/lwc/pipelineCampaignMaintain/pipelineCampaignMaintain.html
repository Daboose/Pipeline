<template>
  <p class="err" lwc:if={error}>{error}</p>
  <p class="note" lwc:if={inactive}>
    This campaign is not active, so no deals can be put in it. Deals already in
    it can still be taken out.
  </p>
  <div class="empty" lwc:if={noKinds}>
    Tick Opportunities, Risks or ROSA above to list deals.
  </div>
  <table class="mtbl" lwc:else>
    <colgroup>
      <col style="width: 19%" />
      <col style="width: 11%" />
      <col style="width: 12%" />
      <col style="width: 11%" />
      <col style="width: 13%" />
      <col style="width: 11%" />
      <col style="width: 13%" />
      <col style="width: 10%" />
    </colgroup>
    <thead>
      <tr>
        <th>Deal</th>
        <th>Type</th>
        <th>Brand</th>
        <th class="num">Value / year</th>
        <th>Sales rep</th>
        <th>Stage</th>
        <th>In campaign</th>
        <th class="mid">Add / remove</th>
      </tr>
    </thead>
    <tbody>
      <template for:each={lines} for:item="l">
        <tr key={l.key} class={l.cls}>
          <template lwc:if={l.isHead}>
            <td colspan="8">
              <div class="sgcell">
                <button
                  type="button"
                  class="rb rem"
                  data-member={l.g.memberId}
                  disabled={saving}
                  title="Remove from the campaign"
                  aria-label="Remove from the campaign"
                  onclick={handleAskMember}
                >
                  <span class="mark"></span>
                </button>
                <span class="sn">{l.g.name}</span>
                <span class="fac" lwc:if={l.g.isFacility}>Facility</span>
                <template for:each={l.g.plates} for:item="p">
                  <span key={p.key} class={p.cls}>{p.text}</span>
                </template>
                <span class="cnt">{l.g.count}</span>
              </div>
            </td>
          </template>
          <template lwc:else>
            <td>
              <b>{l.r.name}</b>
              <span class="phys" lwc:if={l.r.physician}
                >Physician: {l.r.physician}</span
              >
            </td>
            <td>{l.r.typeWord}</td>
            <td>{l.r.brand}</td>
            <td class="num">{l.r.value}</td>
            <td>{l.r.owner}</td>
            <td>{l.r.stage}</td>
            <td>
              <span class="inpill" lwc:if={l.r.inCampaign}>In campaign</span>
              <span class="outpill" lwc:else>Not in</span>
            </td>
            <td class="mid">
              <button
                type="button"
                class={l.r.btnCls}
                data-id={l.r.id}
                disabled={l.r.disabled}
                title={l.r.title}
                aria-label={l.r.title}
                onclick={handlePress}
              >
                <span class="mark"></span>
              </button>
              <span class="lockn" lwc:if={l.r.note}>{l.r.note}</span>
            </td>
          </template>
        </tr>
      </template>
    </tbody>
  </table>
  <div class={askCls} lwc:if={askOpen}>
    <div
      class="ask"
      role="dialog"
      aria-modal="true"
      aria-label="Remove from the campaign"
    >
      <p>{askText}</p>
      <div class="row">
        <button type="button" class="btn sec" onclick={handleAskNo}>
          Cancel
        </button>
        <button type="button" class="btn danger" onclick={handleAskYes}>
          Proceed
        </button>
      </div>
    </div>
  </div>
  <div class="toast" lwc:if={toast}>{toast}</div>
  <div class="wait" lwc:if={busy}>
    <div class="spin"></div>
    <span>{busyText}</span>
  </div>
</template>
